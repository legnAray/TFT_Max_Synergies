<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云顶之弈 · 最大羁绊计算器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>云顶之弈 · 最大羁绊计算器</h1>
  <p class="sub" id="subtitle">整数规划精确最优 · 可选羁绊质量（档位总和）或羁绊数量（不同名计数）</p>
</header>
<main>
  <section class="panel">
    <div class="field">
      <label>人口档位（可多选，人口越高求解越慢）</label>
      <div class="chips" id="levelChips"></div>
    </div>
    <div class="row">
      <div class="field">
        <label>每档解数</label>
        <div class="chips" id="topkChips"></div>
      </div>
      <div class="field">
        <label>评分模式</label>
        <div class="chips" id="modeChips"></div>
      </div>
      <div class="field">
        <label>屏蔽</label>
        <div class="chips"><button class="chip" id="ban5costChip">全部 5 费棋子</button></div>
      </div>
    </div>
    <div class="field">
      <label>必带棋子（锁死后在剩余人口里求最优）</label>
      <div class="picker" data-picker="locked">
        <input placeholder="点击直接选择，或输入棋子名筛选" autocomplete="off">
        <div class="suggest hidden"></div>
      </div>
      <div class="chips picked" data-list="locked"></div>
    </div>
    <div class="field">
      <label>纹章（直接计入羁绊计数，不指定携带者）<span class="hint" id="emblemCount">0/10</span></label>
      <div class="picker" data-picker="emblem">
        <input placeholder="点击直接选择（可重复叠加），或输入羁绊名筛选" autocomplete="off">
        <div class="suggest hidden"></div>
      </div>
      <div class="chips picked" data-list="emblem"></div>
    </div>
    <div class="field">
      <label>固定羁绊（至少激活 N 档）</label>
      <div class="picker" data-picker="pin">
        <input placeholder="点击直接选择（默认固定 1 档，chip 上可调），或输入筛选" autocomplete="off">
        <div class="suggest hidden"></div>
      </div>
      <div class="chips picked" data-list="pin"></div>
    </div>
    <div class="field">
      <label>屏蔽棋子（不上场）</label>
      <div class="picker" data-picker="banUnit">
        <input placeholder="点击直接选择要屏蔽的棋子，或输入筛选" autocomplete="off">
        <div class="suggest hidden"></div>
      </div>
      <div class="chips picked" data-list="banUnit"></div>
    </div>
    <div class="field">
      <label>屏蔽羁绊（硬屏蔽：该羁绊不许激活）</label>
      <div class="picker" data-picker="banTrait">
        <input placeholder="点击直接选择要屏蔽的羁绊，或输入筛选" autocomplete="off">
        <div class="suggest hidden"></div>
      </div>
      <div class="chips picked" data-list="banTrait"></div>
    </div>
    <div class="actions">
      <button id="solveBtn" class="primary">开始计算</button>
      <span id="status" class="status"></span>
    </div>
  </section>
  <section id="results"></section>
</main>
<footer>数据 CommunityDragon · 求解 glpk.js（GLPK WASM）· 与 CLI 同一求解核心</footer>
<script src="app.js"></script>
</body>
</html>
